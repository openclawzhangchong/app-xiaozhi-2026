name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (clone exact version 3.47.2)
        run: |
          retry() { for i in 1 2 3 4 5; do echo "== attempt $i =="; "$@" && return 0; echo "retry $i failed, sleep 8"; sleep 8; done; return 1; }
          retry git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Pre-download Dart SDK (with retry)
        run: |
          retry() { for i in 1 2 3 4 5; do echo "== attempt $i =="; "$@" && return 0; echo "retry $i failed, sleep 8"; sleep 8; done; return 1; }
          retry flutter --version
        shell: bash

      - name: Install dependencies
        run: |
          retry() { for i in 1 2 3 4 5; do echo "== attempt $i =="; "$@" && return 0; echo "retry $i failed, sleep 8"; sleep 8; done; return 1; }
          retry flutter pub get
        shell: bash

      - name: Generate code (freezed / json_serializable)
        run: |
          retry() { for i in 1 2 3 4 5; do echo "== attempt $i =="; "$@" && return 0; echo "retry $i failed, sleep 8"; sleep 8; done; return 1; }
          retry dart run build_runner build --delete-conflicting-outputs
        shell: bash

      - name: Diagnostic - dump generated model files
        run: |
          echo "===== agent_model.freezed.dart ====="; cat lib/data/models/agent_model.freezed.dart 2>/dev/null || echo MISSING
          echo "===== agent_model.g.dart ====="; cat lib/data/models/agent_model.g.dart 2>/dev/null || echo MISSING
        shell: bash

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (clone exact version 3.47.2)
        run: |
          retry() { for i in 1 2 3 4 5; do echo "== attempt $i =="; "$@" && return 0; echo "retry $i failed, sleep 8"; sleep 8; done; return 1; }
          retry git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Pre-download Dart SDK (with retry)
        run: |
          retry() { for i in 1 2 3 4 5; do echo "== attempt $i =="; "$@" && return 0; echo "retry $i failed, sleep 8"; sleep 8; done; return 1; }
          retry flutter --version
        shell: bash

      - name: Install dependencies
        run: |
          retry() { for i in 1 2 3 4 5; do echo "== attempt $i =="; "$@" && return 0; echo "retry $i failed, sleep 8"; sleep 8; done; return 1; }
          retry flutter pub get
        shell: bash

      - name: Generate code (freezed / json_serializable)
        run: |
          retry() { for i in 1 2 3 4 5; do echo "== attempt $i =="; "$@" && return 0; echo "retry $i failed, sleep 8"; sleep 8; done; return 1; }
          retry dart run build_runner build --delete-conflicting-outputs
        shell: bash

      - name: Build Web (release)
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web

  # 如需 iOS 发布，请添加 macOS runner 与签名 Secrets（见下方注释）：
  # build-ios:
  #   runs-on: macos-latest
  #   steps:
